<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 12s ease-in-out infinite alternate;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .circuit-line {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .signal-dot {
        animation: travelSignal 6s ease-in-out infinite;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -25px) scale(1.2); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -200; }
      }
      @keyframes travelSignal {
        0% { cx: 120; cy: 110; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 1080; cy: 110; opacity: 0; }
      }
      @keyframes pulsePill {
        0% { opacity: 0.85; transform: translateY(0); }
        100% { opacity: 1; transform: translateY(-3px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 19px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Orbs in Background -->
  <circle class="glow-orb-1" cx="240" cy="120" r="180" fill="url(#orbGrad1)" />
  <circle class="glow-orb-2" cx="960" cy="280" r="210" fill="url(#orbGrad2)" />

  <!-- Dynamic Circuit / Governance Pipelines -->
  <path class="circuit-line" d="M 80 110 L 400 110 L 520 70 L 800 70 L 920 110 L 1120 110" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.35" />
  <path class="circuit-line" d="M 80 340 L 320 340 L 440 375 L 780 375 L 880 340 L 1120 340" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.3" />
  <circle class="signal-dot" cx="120" cy="110" r="3.5" fill="#38bdf8" />

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Status Badge -->
  <g transform="translate(465, 45)">
    <rect width="270" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="16" cy="15" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="20" fill="#38bdf8" class="pill-text" letter-spacing="0.5">API GOVERNANCE &amp; LINTING</text>
  </g>

  <!-- Foreground Title and Subtitle (Always in front) -->
  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" class="title-text" fill="url(#accentGrad)">
    Awesome API Governance &amp; Spectral
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="205" text-anchor="middle" class="subtitle-text">
    Curated Specification Linters, Automated Quality Gates &amp; Contract Standards
  </text>

  <!-- Subtitle Line 2 -->
  <text x="600" y="235" text-anchor="middle" class="subtitle-text" font-size="16px" fill="#64748b">
    OpenAPI 3.1 • Spectral Rulesets • AsyncAPI • Breaking Change Guardrails • OWASP Security
  </text>

  <!-- Dynamic Feature Pills (Foreground Layer below title) -->
  <g transform="translate(130, 285)" class="pulse-pill">
    <!-- Pill 1: Spectral Standards -->
    <g transform="translate(0, 0)">
      <rect width="210" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="105" y="26" text-anchor="middle" fill="#e2e8f0" class="pill-text">📐 Spectral Rulesets</text>
    </g>

    <!-- Pill 2: OpenAPI 3.1 & AsyncAPI -->
    <g transform="translate(240, 0)">
      <rect width="225" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="112" y="26" text-anchor="middle" fill="#e2e8f0" class="pill-text">⚡ OpenAPI 3.1 &amp; AsyncAPI</text>
    </g>

    <!-- Pill 3: Breaking Changes Detection -->
    <g transform="translate(495, 0)">
      <rect width="220" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
      <text x="110" y="26" text-anchor="middle" fill="#e2e8f0" class="pill-text">🛡️ Diffing &amp; Quality Gates</text>
    </g>

    <!-- Pill 4: OWASP Security -->
    <g transform="translate(745, 0)">
      <rect width="200" height="42" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.5" />
      <text x="100" y="26" text-anchor="middle" fill="#e2e8f0" class="pill-text">🔒 OWASP Top 10 Audit</text>
    </g>
  </g>
</svg>
