<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="orbGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient><linearGradient id="orbGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7" stop-opacity=".2"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}}@keyframes travelSignal{0%{cx:120;cy:110;opacity:0}20%,80%{opacity:1}}@keyframes pulsePill{0%{opacity:.85;transform:translateY(0)}}.glow-orb-1{animation:floatOrb1 10s ease-in-out infinite alternate}.glow-orb-2{animation:floatOrb2 12s ease-in-out infinite alternate}.pulse-pill{animation:pulsePill 4s ease-in-out infinite alternate}.circuit-line{stroke-dasharray:8 6;animation:flowDash 20s linear infinite}.signal-dot{animation:travelSignal 6s ease-in-out infinite}.title-text{font-size:42px;font-weight:800;letter-spacing:-.5px}.pill-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-size:19px;font-weight:400;fill:#94a3b8}.pill-text{font-size:13px;font-weight:600}</style></defs><rect width="1200" height="420" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><circle cx="240" cy="120" r="180" fill="url(#orbGrad1)" class="glow-orb-1"/><circle cx="960" cy="280" r="210" fill="url(#orbGrad2)" class="glow-orb-2"/><path fill="none" stroke="#38bdf8" stroke-opacity=".35" stroke-width="1.5" d="M 80 110 L 400 110 L 520 70 L 800 70 L 920 110 L 1120 110" class="circuit-line"/><path fill="none" stroke="#a855f7" stroke-opacity=".3" stroke-width="1.5" d="M 80 340 L 320 340 L 440 375 L 780 375 L 880 340 L 1120 340" class="circuit-line"/><circle cx="120" cy="110" r="3.5" fill="#38bdf8" class="signal-dot"/><rect width="1198" height="418" x="1" y="1" fill="none" stroke="#334155" stroke-opacity=".4" stroke-width="1.5" rx="15"/><g transform="translate(465, 45)"><rect width="270" height="30" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1" rx="15"/><circle cx="16" cy="15" r="4.5" fill="#10b981"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="30" y="20" fill="#38bdf8" class="pill-text" letter-spacing=".5">API GOVERNANCE &amp; LINTING</text></g><text x="600" y="160" fill="url(#accentGrad)" class="title-text" text-anchor="middle">Awesome API Governance &amp; Spectral</text><text x="600" y="205" class="subtitle-text" text-anchor="middle">Curated Specification Linters, Automated Quality Gates &amp; Contract Standards</text><text x="600" y="235" fill="#64748b" class="subtitle-text" font-size="16" text-anchor="middle">OpenAPI 3.1 • Spectral Rulesets • AsyncAPI • Breaking Change Guardrails • OWASP Security</text><g class="pulse-pill"><g transform="translate(130, 285) translate(0, 0)"><rect width="210" height="42" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1" rx="10"/><text x="105" y="26" fill="#e2e8f0" class="pill-text" text-anchor="middle">📐 Spectral Rulesets</text></g><g transform="translate(130, 285) translate(240, 0)"><rect width="225" height="42" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".5" stroke-width="1" rx="10"/><text x="112" y="26" fill="#e2e8f0" class="pill-text" text-anchor="middle">⚡ OpenAPI 3.1 &amp; AsyncAPI</text></g><g transform="translate(130, 285) translate(495, 0)"><rect width="220" height="42" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity=".5" stroke-width="1" rx="10"/><text x="110" y="26" fill="#e2e8f0" class="pill-text" text-anchor="middle">🛡️ Diffing &amp; Quality Gates</text></g><g transform="translate(130, 285) translate(745, 0)"><rect width="200" height="42" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity=".5" stroke-width="1" rx="10"/><text x="100" y="26" fill="#e2e8f0" class="pill-text" text-anchor="middle">🔒 OWASP Top 10 Audit</text></g></g></svg>